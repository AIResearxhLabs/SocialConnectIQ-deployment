# CP-17: Stage 2 Release Build. HUMAN GATE 1 = environment "main-to-rel"
name: "Release — Build & Regression"
on:
  workflow_dispatch:
    inputs:
      version: {description: "e.g. 1.3.0", required: true, type: string}
      include_frontend: {type: boolean, default: true}
env:
  REG: us-central1-docker.pkg.dev/${​{ secrets.GCP_PROJECT_ID }}/socialconnectiq

jobs:
  verify-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${​{ secrets.REPO_PAT }}
          script: |
            for (const r of ['SocialConnectIQ','SocialConnectIQ-frontend','MCPSocialTools']) {
              const {data}=await github.rest.actions.listWorkflowRunsForRepo(
                {owner:'AIResearxhLabs',repo:r,branch:'main',status:'completed',per_page:1});
              const c=data.workflow_runs[0]?.conclusion||'none';
              console.log(`${r}: ${c}`);
              if(c!=='success') core.warning(`${r}: CI=${c}`);
            }

  promote-to-rel:
    name: "HUMAN GATE 1 — Approve release promotion"
    runs-on: ubuntu-latest
    needs: [verify-ci]
    environment: main-to-rel
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {token: "${​{ secrets.REPO_PAT }}", fetch-depth: 0}
      - run: |
          git config --global user.email "cicd@socialconnectiq.com"
          git config --global user.name "CI"
          TAG="v${​{ inputs.version }}-${GITHUB_SHA:0:7}"
          for R in SocialConnectIQ SocialConnectIQ-frontend MCPSocialTools SocialConnectIQ-deployment; do
            git clone "https://x-access-token:${​{ secrets.REPO_PAT }}@github.com/AIResearxhLabs/$R" /tmp/$R
            cd /tmp/$R
            git checkout main && git pull origin main --ff-only
            git show-ref --verify refs/remotes/origin/rel 2>/dev/null \
              && (git checkout -b rel origin/rel && git merge main --ff-only) \
              || git checkout -b rel
            git tag "$TAG" -m "v${​{ inputs.version }}" && git push origin rel --tags
            echo "✅ $R: $TAG" && cd /
          done

  build-backend:
    runs-on: ubuntu-latest
    needs: [promote-to-rel]
    permissions: {id-token: write, contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {repository: AIResearxhLabs/SocialConnectIQ, ref: rel, token: "${​{ secrets.REPO_PAT }}"}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${​{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${​{ secrets.GCP_SERVICE_ACCOUNT }}
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - run: |
          TAG="v${​{ inputs.version }}-${GITHUB_SHA:0:7}"
          for SDF in api-gateway:api-gateway/Dockerfile backend-service:backend-service/Dockerfile \
                     agent-service:services/agent-service/Dockerfile \
                     analytics-service:services/analytics-service/Dockerfile \
                     auth-service:services/auth-service/Dockerfile \
                     integration-service:services/integration-service/Dockerfile \
                     posting-service:services/posting-service/Dockerfile \
                     scheduling-service:services/scheduling-service/Dockerfile; do
            V=${SDF%%:*}; D=${SDF#*:}; I="${​{ env.REG }}/$V"
            docker build --platform linux/amd64 -f "$D" -t "$I:$TAG" -t "$I:rel-latest" . | tail -2
            docker push "$I:$TAG" && docker push "$I:rel-latest" && echo "✅ $V"
          done
          echo "{\"v\":\"${​{ inputs.version }}\",\"tag\":\"$TAG\"}" > manifest.json
      - uses: actions/upload-artifact@v4
        with: {name: "build-manifest-${​{ inputs.version }}", path: manifest.json, retention-days: 30}

  build-frontend:
    runs-on: ubuntu-latest
    needs: [promote-to-rel]
    if: inputs.include_frontend
    steps:
      - uses: actions/checkout@v4
        with: {repository: AIResearxhLabs/SocialConnectIQ-frontend, ref: rel, token: "${​{ secrets.REPO_PAT }}"}
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci && npm run build
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        with: {name: "frontend-dist-${​{ inputs.version }}", path: apps/web/dist/, retention-days: 30}

  regression-test:
    name: "Regression Tests (Release Binaries)"
    runs-on: ubuntu-latest
    needs: [build-backend]
    env:
      API_GATEWAY_URL: http://localhost:8000
      INTEGRATION_SERVICE_URL: http://localhost:8002
      AGENT_SERVICE_URL: http://localhost:8006
      TEST_COLLECTION_PREFIX: ci_test_
      FIREBASE_PROJECT_ID: ${​{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_PRIVATE_KEY: ${​{ secrets.FIREBASE_PRIVATE_KEY }}
      FIREBASE_CLIENT_EMAIL: ${​{ secrets.FIREBASE_CLIENT_EMAIL }}
      FIREBASE_CI_TEST_TOKEN: ${​{ secrets.FIREBASE_CI_TEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${​{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${​{ secrets.GCP_SERVICE_ACCOUNT }}
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: "Start release services"
        run: |
          TAG="v${​{ inputs.version }}-${GITHUB_SHA:0:7}"; R="${​{ env.REG }}"
          docker run -d --name gw -p 8000:8080 -e ENVIRONMENT=ci "$R/api-gateway:$TAG"
          docker run -d --name is -p 8002:8080 \
            -e FIREBASE_PROJECT_ID -e FIREBASE_PRIVATE_KEY -e FIREBASE_CLIENT_EMAIL \
            "$R/integration-service:$TAG"
          docker run -d --name as -p 8006:8080 -e ENVIRONMENT=ci "$R/agent-service:$TAG"
          sleep 30
          for U in http://localhost:8000/health http://localhost:8002/health http://localhost:8006/health; do
            curl -sf --retry 10 --retry-delay 5 "$U" && echo "✅ $U" || echo "⚠️ $U"
          done
      - run: pip install -r requirements.txt pytest-html
      - name: "Run regression suite"
        run: pytest tests/workflows/ -v --tb=short --junitxml=reg.xml --html=reg.html --self-contained-html 2>&1 | tee out.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "regression-${​{ inputs.version }}", path: "reg.*", retention-days: 30}
      - if: always()
        run: echo "## Regression v${​{ inputs.version }}" >> $GITHUB_STEP_SUMMARY && tail -30 out.txt >> $GITHUB_STEP_SUMMARY
      - if: always()
        run: docker rm -f gw is as 2>/dev/null || true
