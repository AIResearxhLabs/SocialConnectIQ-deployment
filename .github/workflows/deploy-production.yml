# CP-18: Stage 3 — Production Deployment (Blue/Green, Zero-Downtime)
# HUMAN GATE 2 = environment "rel-to-deploy"
# HUMAN GATE 3 = environment "production" (2 approvals + 5min wait timer)
name: "Deploy — Production"
on:
  workflow_dispatch:
    inputs:
      version: {description: "Release version (e.g. 1.3.0-abc1234)", required: true, type: string}
      initial_traffic_pct: {type: choice, options: ["10","50","100"], default: "10"}
env:
  REG: us-central1-docker.pkg.dev/${​{ secrets.GCP_PROJECT_ID }}/socialconnectiq
  REGION: ${​{ secrets.GCP_REGION }}
  PROJECT: ${​{ secrets.GCP_PROJECT_ID }}

jobs:
  pre-deploy-checks:
    name: "Pre-Deploy Checks + Human Gate 2"
    runs-on: ubuntu-latest
    environment: rel-to-deploy
    permissions: {id-token: write, contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {ref: rel}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${​{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${​{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: "Verify release images exist in Artifact Registry"
        run: |
          for SVC in api-gateway backend-service agent-service integration-service; do
            gcloud artifacts docker tags list "${​{ env.REG }}/$SVC" \
              --project="${​{ env.PROJECT }}" --filter="tag:v${​{ inputs.version }}" \
              --format="value(tag)" 2>/dev/null | grep -q "." \
              && echo "✅ $SVC:v${​{ inputs.version }}" || echo "⚠️ $SVC not found"
          done

  deploy-backend-wave:
    name: "Deploy Backend (Dark Launch — No Traffic)"
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks]
    permissions: {id-token: write}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${​{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${​{ secrets.GCP_SERVICE_ACCOUNT }}
      - run: |
          TAG="v${​{ inputs.version }}"
          for SVC in auth-service analytics-service scheduling-service agent-service integration-service backend-service posting-service; do
            gcloud run deploy "$SVC" --image="${​{ env.REG }}/${SVC}:${TAG}" \
              --region="${​{ env.REGION }}" --project="${​{ env.PROJECT }}" --no-traffic --quiet | tail -2
            echo "✅ $SVC dark-launched"
          done

  approve-shift-backend:
    name: "Human Gate 3a — Backend Traffic"
    runs-on: ubuntu-latest
    needs: [deploy-backend-wave]
    environment: production
    permissions: {id-token: write}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${​{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${​{ secrets.GCP_SERVICE_ACCOUNT }}
      - run: |
          for SVC in auth-service analytics-service scheduling-service agent-service integration-service backend-service posting-service; do
            gcloud run services update-traffic "$SVC" --region="${​{ env.REGION }}" --project="${​{ env.PROJECT }}" --to-latest --quiet
            echo "🔀 $SVC → latest"
          done

  deploy-api-gateway:
    name: "Deploy API Gateway (Dark)"
    runs-on: ubuntu-latest
    needs: [approve-shift-backend]
    permissions: {id-token: write}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${​{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${​{ secrets.GCP_SERVICE_ACCOUNT }}
      - run: |
          gcloud run deploy api-gateway --image="${​{ env.REG }}/api-gateway:v${​{ inputs.version }}" \
            --region="${​{ env.REGION }}" --project="${​{ env.PROJECT }}" --no-traffic --quiet | tail -3
          GW_URL=$(gcloud run services describe api-gateway --region="${​{ env.REGION }}" --project="${​{ env.PROJECT }}" --format='value(status.url)')
          curl -sf "${GW_URL}/health" && echo "✅ Gateway new revision healthy" || { echo "❌ Health failed"; exit 1; }

  approve-gateway-traffic:
    name: "Human Gate 3b FINAL — Gateway Traffic"
    runs-on: ubuntu-latest
    needs: [deploy-api-gateway]
    environment: production
    permissions: {id-token: write}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${​{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${​{ secrets.GCP_SERVICE_ACCOUNT }}
      - run: |
          gcloud run services update-traffic api-gateway \
            --region="${​{ env.REGION }}" --project="${​{ env.PROJECT }}" --to-latest --quiet
          echo "✅ Gateway: 100% → v${​{ inputs.version }}"

  deploy-frontend:
    name: "Firebase Hosting"
    runs-on: ubuntu-latest
    needs: [approve-gateway-traffic]
    steps:
      - uses: actions/checkout@v4
        with: {repository: AIResearxhLabs/SocialConnectIQ-frontend, ref: rel, token: "${​{ secrets.REPO_PAT }}"}
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci && npm run build
        working-directory: apps/web
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${​{ secrets.REPO_PAT }}
          firebaseServiceAccount: ${​{ secrets.FIREBASE_TOKEN }}
          channelId: live
          entryPoint: apps/web

  post-deploy-smoke:
    name: "Post-Deploy Smoke Tests"
    runs-on: ubuntu-latest
    needs: [deploy-frontend]
    env:
      API_GATEWAY_URL: ${​{ vars.PRODUCTION_API_GATEWAY_URL }}
      FIREBASE_PROJECT_ID: ${​{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_PRIVATE_KEY: ${​{ secrets.FIREBASE_PRIVATE_KEY }}
      FIREBASE_CLIENT_EMAIL: ${​{ secrets.FIREBASE_CLIENT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: pytest tests/workflows/test_wf09_health.py -v --tb=short 2>&1 | tee s.txt
      - if: always()
        run: printf "## 🚀 Deploy v%s\n" "${​{ inputs.version }}" >> $GITHUB_STEP_SUMMARY && tail -20 s.txt >> $GITHUB_STEP_SUMMARY

  rollback-on-failure:
    name: "Auto-Rollback on Failure"
    runs-on: ubuntu-latest
    needs: [deploy-backend-wave, deploy-api-gateway, deploy-frontend]
    if: failure()
    permissions: {id-token: write}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${​{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${​{ secrets.GCP_SERVICE_ACCOUNT }}
      - run: |
          for SVC in api-gateway backend-service agent-service integration-service auth-service analytics-service posting-service scheduling-service; do
            PREV=$(gcloud run revisions list --service=$SVC --region="${​{ env.REGION }}" --project="${​{ env.PROJECT }}" --format='value(metadata.name)' --sort-by='~metadata.creationTimestamp' --limit=2 | tail -1)
            [ -n "$PREV" ] && gcloud run services update-traffic "$SVC" --region="${​{ env.REGION }}" --project="${​{ env.PROJECT }}" --to-revisions="${PREV}=100" --quiet && echo "↩️ $SVC → $PREV"
          done
      - run: echo "## 🚨 ROLLBACK for v${​{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
