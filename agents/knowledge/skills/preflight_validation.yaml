# Pre-Flight Deployment Validation Skill
# Converted from: agents/skills/preflight_validator.py
# Version: 1.0.0

metadata:
  id: "skill-preflight-validation-v1"
  name: "Pre-Flight Deployment Validation"
  version: "1.0.0"
  category: "deployment_preparation"
  tags:
    - validation
    - docker
    - infrastructure
    - health-check
    - prerequisites
  created_at: "2024-01-15T10:00:00Z"
  updated_at: "2024-01-15T10:00:00Z"

understanding:
  purpose: "Verify all deployment prerequisites before execution to prevent costly failures"
  when_to_use: "Execute immediately after authorization and before any build/deployment operations"
  prerequisites:
    - "User authentication completed"
    - "Target environment identified"
    - "Configuration files accessible"
  importance: "CRITICAL"
  expected_outcomes:
    - "Validation report with pass/fail status"
    - "Clear remediation guidance for failures"
    - "Decision on deployment readiness"

knowledge_domains:
  - domain: "docker_operations"
    concepts:
      - "Docker daemon must be running"
      - "Docker API version compatibility"
      - "Container orchestration readiness"
    relationships:
      - "daemon_running → api_accessible → container_operations"
    constraints:
      - "Cannot deploy without running daemon"

  - domain: "system_resources"
    concepts:
      - "Disk space for images and volumes"
      - "Memory for container stability"
      - "CPU capacity for builds"
    relationships:
      - "available_disk → image_storage → deployment_capacity"
    constraints:
      - "Local requires minimum 10GB disk"

  - domain: "configuration_integrity"
    concepts:
      - "YAML files must be valid"
      - "Environment variables required"
      - "File paths must exist"
    relationships:
      - "valid_yaml → parsed_config → deployment_parameters"
    constraints:
      - "Malformed YAML blocks deployment"

decision_patterns:
  - condition: "always"
    action: "validate_docker_daemon_status"
    priority: "CRITICAL"
    tools_required: ["execute_command"]
    success_criteria: "Docker daemon responds with version info"
    failure_handling: "BLOCK: Start Docker Desktop"

  - condition: "always"
    action: "validate_configuration_files"
    priority: "CRITICAL"
    tools_required: ["read_file"]
    success_criteria: "YAML files parse successfully"
    failure_handling: "BLOCK: Fix YAML syntax"

  - condition: "always"
    action: "validate_system_resources"
    priority: "HIGH"
    tools_required: ["execute_command"]
    success_criteria: "Disk >= 10GB, Memory >= 2GB"
    failure_handling: "WARN: Free resources or BLOCK if critical"

tool_sequences:
  - sequence_name: "docker_validation"
    steps:
      - tool: "execute_command"
        action: "check_daemon"
        inputs:
          command: "docker info --format '{{.ServerVersion}}'"
        outputs: ["version"]
        validation: "Version string returned"

  - sequence_name: "resource_check"
    steps:
      - tool: "execute_command"
        action: "check_disk"
        inputs:
          command: "df -h / | awk 'NR==2 {print $4}'"
        outputs: ["disk_space"]
        validation: "Parse and compare to threshold"

learning_examples:
  - scenario: "Docker daemon not running"
    context:
      environment: "local"
      os: "macOS"
    actions_taken:
      - "Detected connection error"
      - "Provided clear remediation"
    outcome: "SUCCESS"
    metrics:
      resolution_time_seconds: 95
    insights: "Clear remediation resolves 98% of cases"

performance_metrics:
  success_rate: 0.94
  avg_execution_time_seconds: 2.3
  failure_modes:
    - mode: "Docker not installed"
      frequency: 0.08
      impact: "BLOCKING"
  optimization_opportunities:
    - "Cache daemon status for 30 seconds"
    - "Parallelize independent checks"

evolution:
  learning_enabled: true
  feedback_loops:
    - "Track check failure frequency"
    - "Measure remediation effectiveness"
  adaptation_rules:
    - condition: "failure_rate > 0.15 for 7 days"
      action: "Adjust thresholds or improve detection"
      requires_approval: false
  versioning_strategy: "semantic_based_on_changes"